<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>心理測驗</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div id="content">
    <h1>人格特質分析</h1>
    <p>點擊下方開始測試...</p>
    <button onclick="showScare()">開始測試</button>
</div>

<div id="overlay" onclick="location.reload()">
    <h1>我抓到你了。</h1>
</div>

<script>
    function showScare() {
        document.getElementById('overlay').style.display = 'flex';
    }
</script>

</body>
</html>
